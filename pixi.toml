[workspace]
name = "trainer-gui"
version = "0.1.0"
description = "Unified training terminal for the Modal point-cloud training scripts."
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

# Local-side env only - training runs in each model's own env (envs/pixi.toml),
# whose torch pins carry their own python/numpy; the .npz/JSON contract between
# the two sides is version-agnostic.
[dependencies]
python = "3.13.*"
numpy = ">=2"
scipy = "*"             # cKDTree/sparse graphs: KNN smoothing, sieve, ALPINE clustering, HAG grids
pyside6 = "*"           # desktop UI
python-pdal = "*"       # HAG (CSF/SMRF), LAZ I/O, and the ply/pcd readers
pyproj = "*"            # CRS capture/validation/restore (readers.py -> dataset.py export)
pip = "*"

[pypi-dependencies]
modal = "*"
laspy = { version = ">=2.5", extras = ["lazrs"] }
pgeof = ">=0.3"         # computed geometric feature channels, Weinmann optimal neighborhood (dataset.py geo_features)
trainer-gui = { path = ".", editable = true }

[activation.env]
# Don't scatter __pycache__/ dirs across the source tree: Python writes bytecode
# caches whenever it imports a module, so running the GUI/tests via pixi
# would litter them everywhere. This disables that for anything launched in the
# env (negligible import-speed cost for a local app).
PYTHONDONTWRITEBYTECODE = "1"

[tasks]
gui = "trainer-gui"                    # launch the desktop app
