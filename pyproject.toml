[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainer-gui"
version = "0.1.0"
description = "Unified training terminal for the Modal point-cloud training scripts"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "numpy>=1.24",
    "scipy>=1.10",
    "laspy[lazrs]>=2.5",
    "matplotlib>=3.8",
    "modal>=0.64",
    "pgeof>=0.3",
]

[project.scripts]
trainer-gui = "trainer_gui.main:main"

[tool.setuptools.packages.find]
include = ["trainer_gui*"]
